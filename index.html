<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Tirage de cartes 🎴</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { height: 100%; overflow: hidden; background: #0f172a; font-family: Inter, system-ui, sans-serif; color: #e2e8f0; }
      #zone {
        position: fixed; inset: 0;
        display: flex; align-items: center; justify-content: center;
        cursor: pointer; user-select: none; -webkit-user-select: none;
        touch-action: manipulation;
      }
      #zone img {
        max-width: 92vw; max-height: 85vh;
        border-radius: 14px;
        box-shadow: 0 20px 60px rgba(0,0,0,.6);
        display: none;
      }
      #hint { text-align: center; padding: 20px; line-height: 1.7; }
      #hint h1 { font-size: 1.8rem; margin-bottom: .6rem; }
      #hint p { color: #94a3b8; font-size: 1rem; }
      #hud {
        position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%);
        font-size: .85rem; color: #64748b; background: rgba(15,23,42,.7);
        padding: 6px 14px; border-radius: 999px; white-space: nowrap; max-width: 92vw; overflow: hidden; text-overflow: ellipsis;
      }
      #counter { position: fixed; top: 14px; right: 16px; color: #64748b; font-size: .85rem; }
      .btn {
        position: fixed; background: rgba(30,41,59,.85); color: #cbd5e1;
        border: 1px solid #334155; border-radius: 8px;
        padding: 7px 12px; font-size: .85rem; cursor: pointer;
        touch-action: manipulation;
      }
      .btn:hover { background: #334155; }
      #changeBtn { top: 14px; left: 16px; }
      #clearBtn { top: 56px; left: 16px; font-size: .78rem; padding: 5px 10px; color: #f87171; display: none; }
      #shuffleNote {
        position: fixed; bottom: 46px; left: 50%; transform: translateX(-50%);
        font-size: .8rem; color: #facc15; display: none; white-space: nowrap;
      }
      #loader {
        position: fixed; inset: 0; display: none; flex-direction: column; gap: 10px;
        align-items: center; justify-content: center; text-align: center; padding: 20px;
        background: rgba(15,23,42,.92); z-index: 10; font-size: 1rem; color: #94a3b8;
      }
      #loader .bar {
        width: 60vw; max-width: 300px; height: 8px; border-radius: 999px;
        background: #1e293b; overflow: hidden;
      }
      #loader .bar i { display: block; height: 100%; width: 0%; background: #38bdf8; transition: width .2s; }
      #loader .warn { color: #facc15; font-size: .85rem; max-width: 90vw; }
      #loader .btn { position: static; margin-top: 8px; }
    </style>
  </head>
  <body>
    <input type="file" id="picker" accept="image/*" multiple style="display:none" />
    <button class="btn" id="changeBtn" title="Changer les images du paquet">🔄 Changer</button>
    <button class="btn" id="clearBtn" title="Effacer les images enregistrées">🗑 Effacer</button>
    <div id="counter"></div>
    <div id="shuffleNote">🎒 Paquet remélagé !</div>
    <div id="loader">
      <div id="loadMsg">⏳ Préparation…</div>
      <div class="bar"><i id="loadBar"></i></div>
      <div class="warn" id="loadWarn"></div>
      <button class="btn" id="closeLoader" style="display:none">Fermer</button>
    </div>
    <div id="zone">
      <div id="hint">
        <h1>🎴 Tirage de cartes</h1>
        <p><strong>1.</strong> Clique pour choisir tes images (compressées et mémorisées)<br />
        <strong>2.</strong> Ensuite, chaque clic tire une carte au hasard<br />
        <strong>3.</strong> Sur ordinateur : <kbd>F</kbd> = plein écran</p>
      </div>
      <img id="carte" alt="carte tirée" />
    </div>
    <div id="hud">Clic = tirer une carte</div>

    <script>
      let db;
      function openDB() {
        return new Promise((res, rej) => {
          const r = indexedDB.open("tirage-cartes", 2);
          r.onupgradeneeded = () => {
            const d = r.result;
            if (!d.objectStoreNames.contains("images")) d.createObjectStore("images");
          };
          r.onsuccess = () => res(r.result);
          r.onerror = () => rej(r.error);
          r.onblocked = () => rej(new Error("blocked"));
        });
      }
      function dbGetAll() {
        return new Promise((res, rej) => {
          const t = db.transaction("images", "readonly").objectStore("images").getAll();
          t.onsuccess = () => res(t.result || []);
          t.onerror = () => rej(t.error);
        });
      }
      function dbClear() {
        return new Promise((res, rej) => {
          const t = db.transaction("images", "readwrite").objectStore("images").clear();
          t.onsuccess = () => res();
          t.onerror = () => rej(t.error);
        });
      }
      function dbPutAll(blobs) {
        // tout enregistrer en UNE transaction, avec suivi
        return new Promise((res, rej) => {
          const tx = db.transaction("images", "readwrite");
          const store = tx.objectStore("images");
          blobs.forEach(b => store.add(b));
          tx.oncomplete = () => res();
          tx.onerror = () => rej(tx.error);
          tx.onabort = () => rej(tx.error || new Error("transaction avortée"));
        });
      }

      // ---- Compression avec timeout et repli sur l'original ----
      function compress(file) {
        const MAX = 1600;
        return new Promise((resolve) => {
          let done = false;
          const finish = (r) => { if (!done) { done = true; resolve(r); } };
          const timeout = setTimeout(() => finish(file), 12000); // 12s max par image
          const url = URL.createObjectURL(file);
          const im = new Image();
          im.onload = () => {
            try {
              let w = im.naturalWidth, h = im.naturalHeight;
              if (!w || !h) { clearTimeout(timeout); URL.revokeObjectURL(url); return finish(file); }
              if (w > MAX || h > MAX) {
                if (w >= h) { h = Math.round(h * MAX / w); w = MAX; }
                else { w = Math.round(w * MAX / h); h = MAX; }
              }
              const c = document.createElement("canvas");
              c.width = w; c.height = h;
              c.getContext("2d").drawImage(im, 0, 0, w, h);
              c.toBlob(b => { clearTimeout(timeout); URL.revokeObjectURL(url); finish(b || file); }, "image/jpeg", 0.85);
            } catch (e) { clearTimeout(timeout); URL.revokeObjectURL(url); finish(file); }
          };
          im.onerror = () => { clearTimeout(timeout); URL.revokeObjectURL(url); finish(file); };
          im.src = url;
        });
      }

      let paquet = [];
      let total = 0, vues = 0;
      const zone = document.getElementById("zone");
      const img = document.getElementById("carte");
      const hint = document.getElementById("hint");
      const counter = document.getElementById("counter");
      const hud = document.getElementById("hud");
      const note = document.getElementById("shuffleNote");
      const picker = document.getElementById("picker");
      const loader = document.getElementById("loader");
      const loadBar = document.getElementById("loadBar");
      const loadMsg = document.getElementById("loadMsg");
      const loadWarn = document.getElementById("loadWarn");
      const closeLoader = document.getElementById("closeLoader");
      const clearBtn = document.getElementById("clearBtn");

      function shuffle(a) {
        for (let i = a.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
      }

      function showLoader() { loader.style.display = "flex"; closeLoader.style.display = "none"; loadWarn.textContent = ""; }
      function hideLoader() { loader.style.display = "none"; }

      function startPaquet(blobs) {
        paquet = blobs.map(b => URL.createObjectURL(b));
        total = paquet.length;
        vues = 0;
        shuffle(paquet);
        hint.style.display = "none";
        clearBtn.style.display = "block";
        hud.textContent = "Clic = tirer une carte";
        tirer();
      }

      function tirer() {
        if (!paquet.length) return;
        if (paquet.length === total && vues > 0) {
          shuffle(paquet);
          note.style.display = "block";
          setTimeout(() => (note.style.display = "none"), 2500);
        }
        const carte = paquet.pop();
        vues++;
        img.src = carte;
        img.style.display = "block";
        counter.textContent = (total - (vues % total)) + " / " + total + " restantes";
      }

      zone.addEventListener("click", () => {
        if (!total) picker.click();
        else tirer();
      });

      document.getElementById("changeBtn").addEventListener("click", (e) => {
        e.stopPropagation();
        picker.click();
      });

      clearBtn.addEventListener("click", async (e) => {
        e.stopPropagation();
        if (!confirm("Effacer toutes les images enregistrées ?")) return;
        try { await dbClear(); } catch (err) {}
        paquet = []; total = 0; vues = 0;
        img.style.display = "none";
        hint.style.display = "block";
        counter.textContent = "";
        clearBtn.style.display = "none";
        hud.textContent = "Clic = choisir des images";
      });

      picker.addEventListener("change", async () => {
        const files = Array.from(picker.files).filter(f => f.type.startsWith("image/"));
        picker.value = "";
        if (!files.length) return;
        showLoader();
        const compressed = [];
        let failed = 0;
        try {
          for (let i = 0; i < files.length; i++) {
            loadMsg.textContent = "⏳ Compression " + (i + 1) + " / " + files.length + "…";
            const b = await compress(files[i]);
            if (b) compressed.push(b); else failed++;
            loadBar.style.width = Math.round(((i + 1) / files.length) * 100) + "%";
          }
          loadMsg.textContent = "💾 Enregistrement de " + compressed.length + " images…";
          await dbClear();
          await dbPutAll(compressed);
          if (failed) loadWarn.textContent = "⚠️ " + failed + " image(s) ignorée(s).";
          startPaquet(compressed);
          setTimeout(hideLoader, failed ? 2500 : 300);
        } catch (err) {
          loadMsg.textContent = "❌ Erreur d'enregistrement";
          loadWarn.textContent = (err && err.message ? err.message : "Erreur inconnue") + " — les images restent affichées pour cette session.";
          closeLoader.style.display = "block";
          if (compressed.length) startPaquet(compressed);
        }
      });

      closeLoader.addEventListener("click", hideLoader);

      document.addEventListener("keydown", (e) => {
        if (e.key === "f" || e.key === "F") {
          if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {});
          else document.exitFullscreen();
        }
      });

      (async () => {
        try {
          db = await openDB();
          const blobs = await dbGetAll();
          if (blobs && blobs.length) startPaquet(blobs);
          else hud.textContent = "Clic = choisir des images";
        } catch (err) {
          hud.textContent = "⚠️ Stockage indisponible — clique pour charger des images";
          loadWarn.textContent = "";
        }
      })();
    </script>
  </body>
</html>
